[project]
name = "photobooth"
version = "0.1.0"
description = "Photobooth application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gphoto2>=2.6.3",
    "pillow>=12.2.0",
    "pkgconfig>=1.5.5",
    "PyYAML>=6.0.2",
    "httpx",
    "tqdm",
    "timg",
]

[project.scripts]
photobooth = "photobooth.main:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photobooth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
